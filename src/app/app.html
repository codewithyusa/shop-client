<nav class="navbar">
  <div class="navbar-container">

    <a class="brand" routerLink="/home">YUSA SHOP</a>

    @if (isAuthPage()) {
      <div class="nav-links">
        <a class="nav-link" routerLink="/signup">Sign Up</a>
        <a class="nav-link" routerLink="/login">Login</a>
      </div>
    } @else if (isLoggedIn()) {
      <div class="nav-links">
        <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
        <a class="nav-link" routerLink="/orders" routerLinkActive="active">Orders</a>
        <a class="nav-link cart-link" routerLink="/cart" routerLinkActive="active">
          Cart
          @if (cartCount() > 0) {
            <span class="cart-badge">{{ cartCount() }}</span>
          }
        </a>
        <a class="nav-link" routerLink="/favorites" routerLinkActive="active">Favorites</a>
        @if (isAdmin()) {
          <a class="dashboard-button" routerLink="/admin">Dashboard</a>
        }
        <button class="logout-button" type="button" (click)="logout()">Logout</button>
        <a routerLink="/profile" class="user-button" title="Account">👤</a>
      </div>
    } @else {
      <div class="nav-links">
        <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        <a class="nav-link" routerLink="/products" routerLinkActive="active">Products</a>
        <a class="nav-link" routerLink="/login">Sign In</a>
        <a class="nav-link signup-link" routerLink="/signup">Sign Up</a>
      </div>
    }

  </div>
</nav>

<main>
  <router-outlet></router-outlet>
</main>

@if (!isAuthPage()) {
  <app-footer></app-footer>
}
