<div class="home-page">

  <section class="hero">
    <div class="hero-content">
      <p class="welcome">Welcome to YUSA SHOP</p>
      <h1>Explore Our Categories</h1>
      <p class="description">Discover the latest trends in fashion</p>
    </div>
  </section>

  <section class="categories-section">
    <div class="categories-grid">
      @for (cat of categories; track cat.name) {
        <a [routerLink]="['/products']" [queryParams]="{category: cat.filter}" class="category-card">
          <img [src]="cat.image" [alt]="cat.name" class="category-image" />
          <div class="category-overlay">
            <h3>{{ cat.name }}</h3>
            <p>{{ cat.description }}</p>
          </div>
        </a>
      }
    </div>
  </section>

</div>
